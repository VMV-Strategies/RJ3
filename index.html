<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiftLog</title>
<meta name="description" content="Personal workout and body composition tracker.">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLog">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="status-scrim" aria-hidden="true"></div>
<div id="onb" hidden></div>
<div id="shell" hidden>
  <main id="view" aria-live="off"></main>
  <div id="mini" hidden></div>
  <nav id="tabs" aria-label="Main"></nav>
</div>
<section id="session" hidden aria-label="Workout"></section>
<div id="overlays"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem">LiftLog needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
